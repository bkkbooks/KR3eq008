body:
  text: 卷上痘疹發微溯源痘診之症不著先秦古書故溯流窮源類多未定之見有謂在母腹中時食穢血而致者有謂在交媾時欲火所鍾者蓋皆胎毒也宋元以來醫家之說大抵皆然而近又有天行疫厲與傷寒同則是外感了與胎毒無干不知傷寒之病人有不患之者而痘則人人不得而免傷寒則既病之後不能保其不再病而痘疹一出之後永不復出如此則所謂胎毒者是也然食穢之於欲火自有男女以來即有之何此不見於漢以前而特於建武以後始有之豈建武以前獨無胎毒耶曰痘疹之症其始也未有不本於胎毒而其既也未始不成於外感惟其本於胎毒故人人不得而免惟其成於外感故特見於建武之後而建武以前無見也經云不平之溫熱者瘡蓋上古之時風氣未漓稟受素厚即有胎毒自能內消寒涼之地腠理閉祕疫厲難侵溫熱之方風氣平安瘡亦不作故未聞有患痘者至建武時胡虜極西北之人到南方溫熱之地腠理開通偶感時行疫厲之氣觸動在胎時所受溫熱毒發為此瘡所傳染無一得免而痘症著矣即如俗所云楊梅瘡者亦起近代亦能傳染其一發之後不復再出又與痘同蓋人在氣交之中故痘疹由外感而成者類能傳染惟莫開其端則其症不著要未可以執一論也惟內染外感相搏而成故欲發之初未見紅點之際以微汗散之未有不愈者失此不汗至於將出未出之時其勢已成更欲汗之虛者不能成漿實者必成斑爛矣可不審哉痘疹始於胎毒繼感瘟疫外邪引動伏毒勢若燎原危險萬分互相傳染為害閭閻所以喻氏為之痘因溫疫而發按外感六經而治所以擇無疫之時宣泄可收十全萬密齊言之最精管柳亦良痘診定論補方尤妙近有引種法由占拿氏發明原理百無一失僅行於粵東尚未廣布宇內江浙之人疑信相半惜乎不能開通奈何能治外感疫厲即能療痘瘡喻氏創之於前是濟世之苦心奈庸俗不知何按近牛苗引種之法已普遍預防預防之藥如古方油飲子辰砂散龍骨膏之類人多用之未有效者痘固不可以預治耶然不治已病治未病亦醫所宜知故凡值天時不正鄉邑痘瘡盛發或遇冬溫陽氣暴泄至春夏之時瘡必大行宜預以涼血降火之藥治之則多者可少少者可無亦或有此理今以經驗一方附於後代天宣化丸人中黃屬土甲已年為君黃芩屬金乙庚年為君黃柏屬水丙辛年為君梔子屬木丁壬年為君黃連屬火戊癸年為君苦參佐荊芥穗佐防風去蘆佐連翹去心酒洗佐紫蘇葉佐牛旁子酒淘炒佐山豆根佐先視其年所屬取其藥以為君其餘主歲者為臣為君者倍之為臣者半之為佐者如臣四分之三於冬至日修合為末取雪水煮升麻和竹瀝調神麯為丸外用辰砂雄黃為衣竹葉湯送下按此方即無效亦無損制人中黃法取甘草大者不拘多少用新竹一節納入甘草仍緊塞無節空處尿缸中浸七七日取出曬乾聽用消毒丹辰砂飛過絲瓜近蒂者三寸燒存性為末上各等分周歲以下一錢一歲以上者二錢蜜調下或將鴿子及雄者煮熟以辰砂搽上令兒服之亦可上二方大抵以涼血為主余友孫元博又以生地黃金銀花川山甲主之亦妙蓋二藥能涼血而川山甲能水能陵又可以引二藥貫通經絡而無閼也若人脾胃素弱者更宜調其胃氣適其寒溫節其乳食間以六君子湯加枳實砂仁木香之類與之使胃氣和暢榮衛流通其瘡易出亦易靨也如或稟受元虛則又宜以滋補化源為主微兼涼血之藥如生地金銀花之類氣血既旺雖即毒盛亦自無妨不宜過服涼解之劑要在融通而已當痘疫未起之年或天時不正溫疫流行之際預服涼血降火之藥減泄伏毒自能減輕伏邪確有此理余在京師旅館有滇南普耳莫君亦來會試談及該處有神皇豆能迎養供奉之其所過之街痘疹不作作者可免夭隕真神物也相傳系神農手植並蒙贈一粒試之果驗此言世人罕知今特記之論痘起足太陽痘疹之症大抵自足太陽經傳變中來蓋痘疹雖非外感卻是因外感而發故陽經先受病與傷寒同錢氏謂五臟各有一證呵缺伸悶肝也時發驚悸心也乍涼乍寒手足涼者脾也面目腮赤咳嗽時嚏者肺也惟腎獨無症以其位在下不受穢也此說似是而非夫痘固毒甚然亦自經絡中受病苟非壞症豈有徑爾入臟之理至於腎獨無症耳尻足稍加冷之故則以痘本火毒而腎為水臟水能剋火故火不敢侵之非以其不受穢也子在母胎之時腎實系之徹始徹終皆腎用事設有穢毒腎當先受矣然則緣何而知其自足太陽起也曰靈樞口問篇治缺伸及嚏俱補足太陽是知缺嚏皆太陽候也素問又曰歲水太過寒氣流行病煩心燥悸寒水夾脊逆流上逆丙火正寒氣流行之謂也寒水逆丙火於面上故面腮俱赤是驚悸腮赤又太陽候也至於咳嗽寒熱則傷寒初起之對亦多有之未聞其以此遽謂為臟病也曰既與傷寒同自太陽來則何以無頭痛項強骨節痛之症曰此屬溫熱受病既殊辨症亦異也痘因外感引動伏毒而發太陽通體之經故陽經先受其始必由太陽亦自然之理也西士占拿氏發明引種法以泄手少陽之毒引種後永不復出是良法也論汗下痘瘡未出疑似之間不可妄用汗下之藥蓋妄汗則虛其表而難成妄下則虛其里而易倒陷也然亦語其平示人精審耳若語風寒外襲應出不出則汗劑亦可用也如大便連日不行煩悶狂躁不與下之寧不夭人生命哉是下劑亦可用也況有不止於此者明表裡別虛實在表宜汗在裡宜下補偏救弊轉危而安亦治法之權衡虛實之妙用也體仁彙編云痘瘡逆者宜以保元湯加牛旁子芩連玄參絲瓜灰芎歸連翹各五分陳皮桂三分白芍藥一錢防風羌活荊芥前胡各三分薑蔥煎服取汗以泄其毒開其滯澀若七八日內病勢沉重色白毒深又用保元湯兼大黃芒硝枳實朴芎歸水煎大下之則裡虛而毒反內攻在裡而汗之則表虛而毒益難出氣血既實毒雖盛而不足以勝其氣血則汗下以泄其毒而病自去矣若氣血虛而毒反勝之則不惟虛人禁汗即毒盡泄去亦決不能存活徒負殺人之謗耳要當精審也辨虛實不食氣促腹脹吐利為裡虛四君子湯加減甚者木香散反此則實不必服藥若臟腑熱甚大便祕小便赤腹滿而喘掌心並腋下汗出誕言妄語渴飲水漿能食而不結痂宜以承氣湯下之身涼痘瘡根窠不紅頂陷為表虛黃耆建中湯加減甚者異功湯反此則實不必服藥矣吐利氣促腹脹為裡虛腹滿而喘二便祕譫狂口渴為裡實細心討論虛實判然矣驗輕重發熱輕則毒氣輕故報痘亦輕發熱重則毒氣重故報痘亦重輕者不必言治重者宜先解表涼血解毒次之及痘既出便當溫補氣血以助其成漿收靨失此不治六日之後無能為矣審之慎之又有兩耳後紅筋起明潤者其痘必輕若紫紅筋起而晦暗者其痘必重若大紅雖微帶紫而色明潤者痘雖重無事二者急用解毒涼血之藥投之亦重而變輕矣察驗耳後紅筋以辨輕重最為明顯易從驚風治法心要云常見一老醫言小兒驚搐多是熱症若先便用驚風藥白附子全蠍姜蠶川烏之類便有壞症後有醫幼科藥只作導赤散加地黃防風進三服導去心經邪熱其搐便止次服寧神膏神效治幼心書序云五苓散在諸家止用之解傷寒溫濕暑毒霍亂而德顯於驚風痰搐瘡疹等疾通四時而用之前同知衡州府事胡省齊因其子驚風得疾問之曰五苓散何必愈此疾乎德顯曰此劑內用茯苓可以安此心之神用澤瀉導小便小腸利而心氣通木得桂而枯足能抑肝之氣而風自止所以能療驚風施之他症亦皆有說省齊深然之此其善用五苓散也小兒驚風搐掣醫者視為一病輒以金石片腦麝香蜈蚣殭蠶蛇蠍等劑非徒無益反增他症德顯則謂有驚風而搐者有風鬱而搐者驚屬心風屬肝而鬱於氣者亦有搐陳氏所謂蓄氣而成搐者是也但未著其方余因驚風則隨症施治若氣鬱而搐者則用寬氣治之以枳殼枳實為主嘗因患搐者倉卒求藥教服鋪家散而搐亦止病家深感之此又治搐之特見也驚者痙也痙有虛實之分剛柔之別急者宜清汗滌痰世俗名曰急驚緩者宜扶脾益氣俗謂慢驚切忌妄用針刺並誤投金石毒烈之品粵省錢澍滋回春丹馳名中外然僅能治急症若慢症誤用立見危殆其仿單誇耀專治急慢驚風者是欲一藥統治諸病欲廣招徠豈不知無心殺人已干天譴奉勸該號速將仿單更正造福無窮生意從此發展是所厚望焉按小兒吸受外邪先傷肺經起自寒熱氣粗久延漸入心胞絡雖有微汗而痰多鼻煽煩躁神昏切忌妄投辛香金石重劑以致陰液消亡熱勢愈熾正氣愈虛肝風陡動則肢掣目竄痙厥生矣慎勿誤認驚風致多傾敗若能於病未猖撅之先用辛涼開肺繼以甘寒化熱潤燥降痰旬日自能平復余歷驗多人挽回謬誤不計其數特將溫邪陷入內耗陰液肝風妄動實非驚恐致病每見病家惶亂醫者庸昧妄投驚藥輕者重重者死憶自喻氏闢之前痙病之名不啻大聲疾呼今尚不能挽狂瀾於既倒則草管人命何忍緘默也矣
