body:
  text: 卷中論望色望色之法明瑩者吉昏晦者凶然陳希夷云凡色之無光者不足謂之色蓋光即虛色災喜皆不成不必斷也然則望色者必於有光中分別明晦以定吉凶然後可耳春青夏赤秋白冬黑以四時判之得時者生失時者凶四色之中又須常帶黃潤之色乃佳脾氣無不在也準頭赤肺中有火耳半黑腎中有邪年壽赤則心火炎眼下青則脾氣逆也由此而推思過半矣鼻準黃明脾氣強也鼻尖青黃淋也白者亡血也赤者血熱也望而知之為之神內經明堂篇言之詳矣論芤脈芤脈今人多不諳其狀脈訣云兩頭有中間無遂滋百世之惑或云無芤脈非也芤者草有孔之名論人參人參君氣溫味甘甘而微苦氣味俱輕陽也陽中微陰無毒白茯苓馬藺為之使反黎蘆惡溲疏滷咸出上黨遼東者佳其根狀如防風而潤實春生苗多於深山中背陰近假漆下濕潤處初生者三四寸一丫五葉四五年後生三丫年深者生四丫五葉中心生一莖俗名百尺杵三月四月有花細小如粟蕊如絲紫白色秋結子或七八枚如大豆生青熟黃又紅自二月四月八月上旬探根李言聞考人參生於陰濕樹林之中著人參考言之詳且晰矣竹刀刮去土暴乾無令見風如人形者神又雷公云大塊類雞腿者良而今人又以瑩堅潤為上有金井玉蘭之號炮製凡用勿取高麗及色枯體虛者採得去蘆用如不去能吐人又丹溪云若服人參一兩入蘆一錢則一兩之參徒費矣戒之主治本經云味甘微寒寒字誤主補五臟安精神定魂魄止驚悸除邪氣明目開心益智久服輕身延年一名金銜一名鬼蓋按五臟之正氣不足而亂氣乘之則心神為之不寧故令虛勞之人夢寐不安神不守舍人參所以安精神定魂魄止驚悸以其能補五臟之正氣也正氣復則邪氣除矣而時師類於補氣之外另求所謂清鎮之藥者謬矣療腸胃中冷心腹鼓痛胸脅逆滿霍亂吐逆調中消渴通血脈消胸中痰破堅積治肺氣不足咳嗽止煩躁變酸水殺金石藥毒令人不忘患虛而多夢俱用之潔古云治脾肺陽氣不足及肺氣喘促短氣少氣補中暖中瀉脾肺胃中火邪然非升藥引用不能補上升之氣升麻一分人參三分為相得也若補下焦元氣瀉腎中火邪茯苓為之使又云補虛用之又能補胃治咳嗽則勿用短氣則用之東垣云人參甘溫能補肺中之氣肺氣旺則四臟之氣皆旺肺主諸氣故也仲景以人參為補血者蓋不自生須得生陽氣之藥乃生陽生則陰長血乃旺矣若陰虛單補血血無由而生無陽故也又云治中湯同乾薑用治腹痛吐逆者裡虛則腹痛此藥補之是補其不足又云補氣用人參如氣短氣不調及喘者加之海藏云人參味甘溫調中益氣即補肺之陽瀉肺之陰也若但言補肺而不論陰陽而寒熱何氣不足誤矣若肺受寒邪宜此補之肺受火邪不宜用也肺為天之氣即手太陰也為清潤之臟貴涼而不貴熱則其為寒象可知若其傷熱則沙參沙參味苦微寒無毒主血積精氣除寒熱補中益肺氣治胃痹心痛結熱邪氣頭痛皮間邪熱安五臟人參味甘微溫補五臟之陽也沙參味苦微寒補五臟之陰也安得不異易老取沙參代人參取其苦也苦則補陰甘則補陽本經雖云補五臟亦須各用本臟藥相佐使隨所引而補一臟也不可不知近世用人參者往往反有殺人之害富貴之家以此為補元氣之妙藥其身欲壑太過藉參補養每見危殆者乃不明當用不當用之過也況雜入溫補劑中則尤謬矣世人僅知用參之補而不知行氣徒形壅塞不能流通矣余用參一錢必加陳皮一分取效敏捷參看治驗録即知其用法按主治要訣謂人參之用有三補氣也止渴也生津也補氣不必言何為生津而止渴蓋脾氣輸於肺肺氣下降津液乃生猶蒸物然熱氣熏蒸旋即成液故氣不足則渴補其氣則津生而渴自止矣能消痰變酸水者脾氣不足不能運化精微故蓄而為飲以人參補之治其本也療腸中冷者氣為陽陽虛則內寒而人參補氣也止腹痛者補裡虛之效也破堅積者養正氣積自除也止燥煩治夢紛紛者本經安精神定魂魄之功也又人參助肺氣何謂能治喘嗽人參實元氣何為能治逆滿此蓋為因虛而致者言正氣奪而用之則為補虛邪氣盛而用之則為實實要在精審而已故潔古又云喘嗽勿用戒實實也余治一人喘嗽服瀉肺藥益甚投以人參一服而止非謂喘嗽概不可用人參也胸脅逆滿反胃吐逆邪氣方盛固不可用人參然傷寒雜病下後亡陰胸中之氣因虛下陷於心之分野而致心下痞者用導氣之藥則痞益甚須用人參補之故仲景治胸痹以人參湯主之若實者則宜枳實薤白桂枝湯也胃虛穀氣不行胸中閉塞而下區者用辛藥瀉之則嘔益甚惟宜益胃揚穀氣而已故胃反嘔吐小半夏湯不愈者服大半夏湯與人參立愈此仲景要訣也今人不察病之虛實不諳藥之補瀉一遇喘滿嘔逆之症便謂有餘雜以破氣之藥投之妄言氣無補法遂視人參若堇鴆然而病人亦遂束手待斃而無憾可勝嘆哉三復經文不覺覙縷論犀角犀角以黑如漆黃如粟上下相透雲頭雨腳分明者為佳近人多巧偽藥染湯煮無所不至然亦易辨犀不可見日並貯若犯之則色理粗燥凡蜜犀角嫩者以鳳仙花染之犀有水旱二種以水犀為上凡心膽肝三經之熱允為良藥雜記夢溪筆談云醫用艾一灼謂之一壯者以壯人為法其言若干壯人當依此數也若老幼羸弱當量力減之不可拘執以誤人余幼時見水蛭惡而溺之數四化為水又一日見之以蜜一匙滴之即縮不動久之亦化為水嗣後雖經陰雨不復活二物之能制蛭毒如此物性相制之理不可不知以備一時緩急之需亦不可少也而昔人有蛭者醫者見之乃極勞擾惜乎其不知此也又云醫者所論人須發眉雖皆毛類而所主五臟各異故有老而須白眉發不白者臟有所偏故也大率發屬心稟火氣故上生須屬腎稟水氣故下生眉屬肝故側生男子腎氣外行上為須下為勢女子宮人無勢則亦無須而眉發無異於男子則知不屬腎也又云四明生奉真良醫也天章閣待制許元江淮發運使奏課於京師方欲入對而其子疾亟瞑而不食惙惙欲逾宿矣奉真視之曰脾已絶不可治死在明日元曰觀其疾勢固知其不可救今方有事須陛對能延數日之期否奉真曰如此事可諸臟皆以衰唯肝臟獨過脾為肝所勝其氣先絶一臟絶即死若急瀉肝氣肝氣衰則脾少緩可延三日過此無藥也乃投藥至晚乃能張目稍稍復啜粥明日漸蘇而能食元曰甚喜奉真笑曰此不足喜肝氣漸舒耳無能為也後三日果卒所載各論多采前哲指迷之言以下高氏續補乃增原書不及細心研究勝讀書十年識者自知釀酒之時寒之則甘熱之則酸酸則蛤粉田螺之類投之涼其熱也甘則以罏火綿包而懸酒中溫其寒也又有酒酸而以官桂砂仁之類救之亦醫家從治之法也治大風眉發脫落苦參末半斤生槿皮末四兩上煉蜜丸彈子大每服一丸日進三服清茶送下治天泡瘡單方用香滋一味治楊梅瘡毒羌活當歸白芍藥金銀花牙皂各五錢冷飯糰四兩即鮮土茯苓共煎服若加蟾蜍一隻陳酒四兩同煎其效尤捷又治一婦面目朝腫腿足午後腫甚六脈浮濡諸治莫效而乞余方治此證由風濕而起內經云面腫曰風足勝腫曰水以麻黃防風開表逐風五苓利濕行水十服諸恙俱瘳此即金匱所謂風水症是也自此以下十三條原抄本所載殷氏校板則無今從原本補入以廣智識又治一婦面目周身黃如染金腹脹氣促始由果齋用仲景梔子柏皮湯治之不應余診脈濡而沉此屬濕蘊日久水竄腠理未能外達郁濕化熱而發黃投以茵陳蒿湯加梔柏大黃以泄濕熱外用金麟黑脊活鯽魚七尾剪魚尾貼臍之四圍當臍勿貼干則易之未及四時水由臍出其黃漸退如是旬日厥疾以瘳按此法捷效壽仿其方法屢治屢驗緣世罕見今特志之以啓後迸然此方準繩中未載偶閲祕旨有一方與此倣佛後質之椿田亦云李冠仙用之亦效若桴鼓第不知始自何人容再查明以待博雅教政瀾志果齋治婦人吐血盈盆諸藥罔效因思前哲有以血導血歸源法囑其取吐出之血瓦器盛之候凝銅鍋炒血黑色以綿紙盛放地上一周時出火毒研極細末用鮮側柏葉五錢麥冬一錢煎湯調血炭末五分二三服血自歸源屢驗屢效又治吐血宜用苦寒者有戒用苦寒者尤當隨症擇用未可執一以誤人也樓氏綱目治吐血皆用諸藥炭亦頗捷效今以血導血歸源亦師其意而變化敏捷取效昭著按余治一婦吐血傾盆數日不止目閉神昏面赤肢軟息粗難臥脈左沉右洪重按幸尚有根此鬱火久蒸肺胃復緣暑熱外逼傷及陽絡致血海不斂危在頃刻因思止血諸藥著寒者多投之必嘔乃變通成法先用甘寒冀其人胃清上血止再商二貼血止亦創見也服後夜寐甚安血止神清惟神倦懶言奄奄一息脈雖稍平右愈浮大無力此血去太多恐延虛脫之患經云血脫者益其氣遂師其意用人參七分秋石水拌黃耆七分黃芩水炙黑歸身一錢炒黑懷山藥錢半茯苓三錢大麥冬錢半去心蒸北五味七粒和入甘蔗汁梨汁藕汁服三帖食進神健而瘳觀此知病有虛實體有強弱本難執一但今人吐血挾虛者多而醫者輒用苦寒是昧於虛實宜乎得愈者少而夭枉者多矣今將八汁飲方附後以備明哲商酌而教正之幸甚又方甘蔗汁藕汁蘆根汁各一酒杯白果汁二匙白蘿蔔汁半酒杯梨汁一酒杯西瓜汁一酒杯生沖鮮荷葉汁三匙七汁和勻隔水燉熱衝入瓜汁不住口緩緩頻飲凡屬虛火轉危為安用之屢效若非夏令無瓜荷二汁即以梨藕二汁倍用天冬百合榨汁亦可代之前方中人參價昂可用真西洋參一錢五分代之消渴一症今醫慣用涼藥愈治愈劇間閲孫東宿治一消渴小便色清而長其味甘脈細數用腎氣丸加桂心北五味鹿角膠益智仁而效又一人喜熱飲而惡涼大便祕小便清長夜尤甚脈浮按數大而重按更無力余思此病由火不能制水故飲一斗小便亦一斗金匱言之詳矣今師其意不泥其方用腎氣丸減車前牛膝加益智仁人參膠糊丸服逾月而痊按消渴症小便多者皆由火虛難以化水故飲一溲一上見口渴而水不消小便多者每用益火之源以消陰翳而獲效若屬中消每用黃草湯下其熱又不可拘執成法而不達變通以誤人者另有治驗詳言之集溢不贅當參合脈症而研究自獲桴鼓之應也曾憶祕旨云大凡消渴服藥獲效必須戒食鹽兩月可免反復若不能食淡方藥雖良終難永年慎之懍之祕旨云溫熱愈後餘邪往往歸之於足發熱腫痛不亟治則痛甚而死者多至輕亦成殘廢幸也名曰截足風今附驗方於後以濟斯厄廣膠一兩入糟醋薑蔥汁四味煬化成膏攤綿紙或紅布上貼患處痛立止糟入醋中將糟鑿碎調勻濾出汁去糟渣勿用薑汁不必多只用少許蔥汁較薑汁多一半糟醋汁須三四倍於蔥汁按此方曾治王木匠年三十餘患溫熱二候乞余治之用白虎湯加味而瘳伊未服善後藥而赴工作從事七日發熱惡寒兩足疼痛不能行立請同人抬至敝廬診其脈洪大而兩尺濡細知是溫熱餘邪下注已成截足風之危候即用此方外敷內服導赤五苓散以清餘熱僅三日而病如失後又治多人皆獲全瘳今特拈出廣為傳布煎方以嫩桑枝五錢易桂枝加淮牛膝三錢鮮車前為引又云咬牙噤口舌青面黑汗出不休手足寒過節謂之真心痛若全腦連齒皆痛手足寒至節謂之真頭痛旦發夕死百難治一皆直中之危候按真心痛症曾治一人證勢危不忍坐視用麻黃附子乾薑桂心各二錢豬肝煎湯頻灌漸次轉溫死中求生之一法也若真頭痛急灸百會穴數壯再用烏附參各二錢薑濃煎吞黑錫丹三十粒非此猛劑不足以追失散之元陽而散其外真之寒邪余遇一急痧證勢倣佛用上法以挽之而痊皆屬三陰直中危證也又云凡病之未現可以預測其兆者如手腳心熱作渴思飲茶水或食已即飢知將患發背三年內眉眶骨痛知將患厲風如手指麻木三年來必驟然中風古人觀神察色審脈象而能先識其病所以扁鵲知齊桓之疾不可為矣則非神乎技者不能步其後矣按內經云聖人治未病而不治已病能知色脈可以萬全此之謂也然今之醫不及也每有症象昭著顯而易見之疴尚遊移不決若是者等而下之也成無已曰凡厥若始得之手足便厥而不溫者是陰經受邪陽氣不足可用四逆湯若手足自熱而至溫從四逆而至厥者傳經之邪也四逆散主之至於六氣之感異於傷寒之傳經者惟舌較為可憑陰症亦有黑胎焦黃胎然其胎必浮胖或滑潤而不枯皆辨症之要法尤宜三復斯言按醫病非難難在疑似之辨不可人云亦云隨波逐流誤人匪淺余於六月中旬治戴姓一證體厥脈虛肢冷周身赤點隱於皮膚口渴譫妄前醫不明妄用辛溫回陽幾危因辨之曰此乃陽症似陰之象況時當盛暑擬用溫熱急下存陰法治之以西洋參三錢錦紋軍三錢枳殼一錢生甘草八分風化硝二錢和沖服後得下黑矢如膠者甚多小便赤澀亦減以本方去硝黃加連翹山梔銀花數帖而安若非力辨辛溫之誤豈不死於庸俗之手而人皆以三陰症而不疑吾所以知非陰症者因口渴譫妄欲飲舌苔焦黃而燥肢體厥逆乃熱深厥深之現象於是用河間溫熱例治之而愈虞天民治一婦夜間發熱早晨即退五心煩熱無休止已延八閲月診其脈六部皆數伏而牢浮取全不應與東垣升陽散火湯四帖熱減其半胸中覺清快勝前連投二服熱悉退後用四物湯加知母酒炒黃柏少佐炮薑二十餘服熱不復作而瘳按夜熱脈數乃陰虛之候若非明眼直進滋陰降火而不疑是抱薪救火矣今因脈伏且牢浮取不應故用升陽散火得效妙在炮薑合知柏以清血分之熱而與陰虛治法有間所以名醫異於庸俗者此也祕冒云一切感證熱入心胞神昏譫語者每用犀角羚羊角連翹金銀花元參生地人中黃等味送下至寶丹往往獲效其有熱邪深入發痙者亦宜以此療之世人遇小兒患此證者妄謂驚風用針刺之走泄真氣陰陽乖逆轉致不救按神昏譫語發痙由於溫熱痰暑轉變者多世間無知女流妄聽妖言謂是驚風以針挑之病勢轉劇者多誤人不淺有等老媼或尼姑等自名神於驚風慣用挑刺無知婦女奉之若神以致雖受其害而不能知特志之以示戒龔雲林云暑邪內干往往忽然頭痛噁心或腹痛腰疼偏身作痛不治之神昏痙厥朝發夕斃惟用白虎丸一服當時血散而愈較之砭刺之耗損其血不若此丸敏捷神效方用千年石灰刮去雜色泥土研極細末清水飛過丸如桐子大每服五十丸視痧之輕重加減燒酒送下真神方也按此丸順氣散血化痰消渴為治痧之仙劑又治心腹痛及婦人崩漏赤白帶下或久患赤白痢疾跌打內傷血不能散服之均效余恆合此丸以濟世獲效果捷千年石灰不可得用古墓中石灰亦可寒痧用酒熱痧用開水溫服隨證酌用切勿拘執然痧脹由於十二經清濁不分流溢於奇經致奇經脈現則為病也乃邪氣滯於經絡每見刮刺開通經絡而效尤捷也祕旨載目中起星足氣中熱宜將兩足浸溫水中搓擦足心引熱下降初起亟治另用白蒺藜三錢煎湯洗目日四五次屢驗或用穀精珠代茶數日即瘳按目中起星由於脾火上衝肝熱挾風凝結或用碧雲散搐鼻散滯氣恆濯其足使熱氣下降或用新橘皮塞鼻中約六時後即退不可誤用寒涼點藥致凝血不散轉生雲翳慎之王光庵雜著云中食之證狀似中風非詳究病因難取捷效曾治一人忽得暴疾口噤難言目不識人四肢不舉急投蘇合香丸不效因詢其致病之由曰適方陪客飲食後忽得此證遂教以煎生薑淡鹽湯多飲探吐之吐出飲食數碗後服白朮陳皮半夏麥芽湯而愈此即食厥若不問明致病之因徒以痰藥風藥治之戕伐脾胃而病日劇是醫之過也按中食之證亦各有致病之因未可拘執一端而論余少時文期匆促每飯後無暇散步録抄課藝日無暇晷飽餐後即倚案揮毫因時患腹痛胸膈滿悶便祕痞脹食不知飢服保和丸及查曲米炭等不效有一老友云三世醫驗中潤字丸最妙遂照方配合服之便通諸恙均瘳陸氏潤字丸功效甚多略舉數端以啓後進凡溫熱濕痰等症量病輕重隨宜增減分量服之最靈最捷今特拈出
