body:
  text: 卷下三瘧治驗張習可日間受微雨及風冷瘧發於暮熱甚於夜遂成三瘧乞診於師用升陽濟陰法瘧漸愈奈不知調攝元氣未復嗜欲不謹九月中旬瘧忽增劇六脈虛數乃陰虛已極而暑邪深入最難療治師問難於余爰思受病之原當先扶正升陽用生地川芎歸身白芍炙草乾薑葛根升麻柴胡煨薑南棗濃煎於瘧未作前三時服一盂四帖後加首烏人參各三錢連服三帖瘧竟不作代訂丸方以善其後治不沾沾於補虛不斤斤於泄邪而方藥病情絲絲入扣古謂成如容易卻艱辛非學識兼全者曷能辨此丸方制首烏四兩大生地三兩人參於朮歸身龜板豬苓炒芩川芎查炭各二兩柴胡一兩六錢淮牛膝一兩五錢乾薑山甲各一兩甘草炙五錢活龜一個入砂仁末二兩煮取龜肉同藥搗勻烘乾其甲骨亦研細末加入鮮荷葉湯泛丸如麻子大每晨服三錢沸湯下服完一料精神倍於平日神水治驗魏子一患嘴唇乾燥皮漸裂痛自服甘露飲大劑旬日微獲小效而病成痼疾乞診於余診得左右兩關脈弦而散顯是津液不能上滋延成繭唇令內服滋液育陰二地二冬元參梨汁等為丸常服外用神水點擦日服一小杯兩月而瘳制神水秘法用青鉛熔化散澆於地成為片取起剪作長條數塊一頭鑽眼懸吊於鍋鍋內置燒酒之上仰張盆盆與鉛相近鍋下燃火使酒沸而氣上衝放鉛片鉛片上有水滴下盆內為之神水取服之以此水從下而上能升腎中之水救上之燥干也按神水之法古人方中亦恆有之未言明製法今果哉先生闡發其義而方始顯婦科驗方薛仲昂云婦人有疾兩乳不嫌其大月水不嫌其多乃生機也治嘔血及諸衄下血等候用豬腰子一具童便二盞陳三白酒一盞貯新瓶內密封泥口日晚以慢火煨熟至初更夜分後更以火溫之發瓶畢食即病篤者止一月效平日瘦怯者並宜服之男女皆效真以血養血之良方也又云前人以先期為血熱後期為血寒然有或前或後者將忽寒忽熱乎大抵氣者血之母氣亂則經期亦亂故調經以理氣為先又云懷孕六七月因爭築著子死腹中惡露直下痛不能勝而欲絕者佛手散主之若胎不損則痛止而子母俱安既損則胎下而母全矣佛手散方附後當歸三錢川芎五錢益母草五錢水酒各半碗煎服停一二時再進二服此方安生胎去敗胎歷驗之良方也又云胎不動而冷如冰即非好胎若以不動言之好胎亦是伏而不動者何可遂斷其死胎也宜服順氣活血藥又云產後忌飲酒但服童便可也童便為臨產仙藥暈眩敗血中心及血崩諸症倉卒不及備藥惟兒初下地時即與童便一盞庶免諸症之患一月之內日服一盞百病不生他藥皆不及此又云產後百病三者最危嘔吐盜汗泄瀉是也三者並見其命必危數症並作治其所急見二凶多一症輕者無害產後陰血虛耗陽浮散其外而靡所依故多發熱治法用四物湯補陰姜通神明炮乾薑能收浮散之陽使合於陰故兼用之然產後脾胃虛損有傷飲食而發熱者誤作血虛則反傷矣故必先問曾食何物有無傷損有惡血未淨者必腹痛而發熱有感冒外感者必頭痛而發熱若發熱飲食自調絕無他症者乃血虛也可以補血若胸膈飽悶噯氣惡食泄瀉等症只隨症治之要知腹滿而不痛者斷非惡血也莫誤產後用益母草銼一大劑三兩濃煎去渣加芎歸末各二錢陳酒童便各一盞服之至再則腹痛血暈之患免且大有補益真治產之司總也此方又名奪命丹為歷驗之良方也產後喜咸愛酸而致咳嗽者必致痼疾終身須自慎之家傳秘方有六簡易而神妙特奇世世保之毋失方列於上種子丸五月五日拔益母草帶根陰乾為末煉蜜為丸如彈子大每服二丸百日有效固胎丸條芩二兩於朮一兩每服三錢上研細末砂仁湯下連服而胎可永安胎熱重者條芩加一兩於朮用米泔水浸保安丸五月五日取益母草去根曬乾為末煉蜜為丸如彈子大懷孕八九月每晨服一丸砂仁湯下服二三十服必無倒產之逆催生丹用益母草四兩焦白芷炒滑石百草霜各二兩臨產服四錢芎歸湯送下效益母丹既產用山楂末三錢濃煎益母草湯陳酒和童便調下第一日服三服二日服二服三日一服第四日第五日山楂末減半第六第七日去山楂末止服三味第八日並三味不服而百疾不生矣歷驗坤元是保丹孕婦病則胎亦病而隨則多兩亡此方能卻胎病使兩無恙方用飛青黛五錢伏龍肝二兩二味研末用井底泥調勻塗臍上當孕處二寸許干則再塗此丹止可施於傷寒極熱之症不可概施者也切記切記慎之慎之朱彥修治產婦陰戶一物如帕垂下俗名產頹宜大補氣以升提之用參耆術各一錢升麻五分後加歸芍甘草陳皮調之又治產婦陰戶下一物如合缽狀此子宮也氣血弱故隨子而下用升麻當歸芎耆服二次後以五倍子作湯洗灌皴其皮覺一響而收入又云大凡胎已足月宜補助氣血為添水行舟萬無難產之厄附錄歷驗方於後炙綿耆熟地各一兩歸身枸杞子黨參龜板醋炙各四錢茯苓三錢白芍川芎各一錢無論胞衣已破未破連服四五帖但用濃煎頭汁取其力厚也此方屢效余恆用之較世傳二寶散佳良按以上各條出於薛仲昂集中議論精純方多簡效詢為女科秘笈世罕見之薛氏所纂余亦未見其書知者尤鮮曾質之椿田兄云書名坤元是保刊於正和年間其方論本於產育寶慶而增廣之世渺流傳蔣亦未見原書惟當日在阮太傳叢書中見其方論節要是否質之明哲訂正以釋其疑而廣醫林之智識拭目以俟之陰陽應象大論云悲勝怒恐勝喜怒勝思喜勝憂思勝恐此即五行生剋之理也古賢治病每用之有桴鼓之應若文摯之怒齊王華元化之怒都督皆宗經旨戴人丹溪亦效其法見於治案然亦有不拘剋制之說者但得其意不必泥其法所謂神而明之存乎其人也按自七情至肌衄從秘旨節錄亦殷本所無茲從原本補載備考按七情之病其原本於五志之偏勝其治仍由格致之從化理固然也故云醫者意也以其所勝而能制其所不勝伏其所主必先其所因自內經難經闡發於前歷代賢哲疏注於後法良效捷啟迪後進功非淺鮮矣韓飛霞醫通有云黃連肉桂能交心腎於頃刻謂治不寐之靈丹歷驗不爽今特拈出以啟後學之悟按前賢方法固良要在對病捷如影響如上法余治一婦驚悸不寐已延半載醫治不效乞余診治尺脈微數兩寸浮洪顯是陽不交陰衛氣僅行於陽而不入於陰故心腎不交也即仿前法用川連二錢另煎待冷桂心二錢另煎待冷用半夏秫米各三錢取甘瀾水煎成加連汁肉桂汁和勻乘溫徐徐頻飲服後覺倦至夜安睡甚酣前患已瘳稍有驚悸改用補心丹加減而愈足見方藥對症如鼓應桴非虛言也內經有肌衄一症謂之血汗治之不得其法往往血流過多面色驟白周身痿倦氣息奄奄而斃者多茲特拈出以備博採良方而濟一時之急也此條與秘旨參看尤佳方載秘旨附錄於下用炒川山甲一錢研極細末重羅篩細粉罨之以帕扎住即止內服補血湯三帖自愈茲從秘旨錄出以濟斯厄余詳治驗錄中按肌衄一症古無良法余治友人楊兄腦後髮際忽出血不止眾皆譁然無法余思與前症相符亟用黃芩煎濃汁俟冷塗之漸收三次而瘳後亦不發龐安時有云四時之中有寒暑燥濕風火相搏喜變諸疾須預察之其飲食五味禽魚蟲菜果實之屬偏有嗜者或金石草木藥素嘗有餌者人五臟有大小高下堅脆端正偏傾六腑亦有大小長短厚薄緩急令人終身長有一病者貴者後賤富者乍貧有常貴有常富有暴富有暴貧有暴樂有暴苦有始樂後苦有離絕蘊結憂恐喜怒夫常貴後賤名曰脫營常富後貧名曰失精暴樂暴苦始樂後苦精竭體沮脫勢侯王精神內傷情慕尊貴妄為喪志始富後貧焦皮攣筋常富惡勞驕墮精消離間親愛者魂遊絕所懷者意喪所慮者神勞結怨者志苦憂愁者閉塞而不行盛怒者迷惑而不治恐懼者蕩憚而不收喜樂者撣散而不藏此皆非外邪所中而得之於內也良工必預審問其由先知臟腑經絡受病之所可舉萬全工不思曉令五臟六腑血氣離守迫至不救又何言哉又曰陰陽虛盛者非謂分尺寸也榮衛者表陽也腸胃者里陰也寒毒爭於榮衛之中必發熱惡寒尺寸俱浮大內必不甚躁設有微煩其人飲食欲溫而惡冷謂陽虛陰盛也可汗之則愈若誤下則死也若寒毒相薄於榮衛之內而陽勝陰衰極陰變陽寒盛生熱熱氣盛而入里熱毒居腸胃之中水液丸之乾涸燥糞結聚其人外不惡寒必蒸蒸發熱而躁甚則讝語其脈浮滑而數或洪實或汗後脈雖遲按之有力外證已不惡寒腹滿而喘此皆為陽盛陰虛當下之則愈若誤汗則死也仲景載三等陽明是陽盛陰虛證矣陽虛則外寒陰虛則內熱陽盛則外熱陰盛則內寒以此別之若陰獨盛而陽氣暴絕必四肢逆冷臍築湊痛身疼如被杖面青或吐或利脈細欲絕名曰陰毒也須急灸臍下服以辛熱之藥令陽氣復生濈然汗出而解若陽獨盛而陰氣暴絕必發躁狂走妄言面赤咽痛身班班如錦文或下利赤黃脈洪實或滑促名曰陽毒也宜用針泄熱服以苦酸之藥令陰氣復生濈然汗出而解也又曰夫邪逆陰陽之氣非汗不能全其天真素問云辛甘發散為陽謂桂枝甘草細辛薑棗附子之類能復陽氣也酸苦湧泄為陰謂苦參大青葶藶苦酒等之類能復陰氣也酸苦之藥既折熱復陰亦當小汗而後利者經云身汗得之而後利則實者可汗是也華佗治法云傷寒病起自風寒入於腠理與精氣分爭榮衛否隔周行不通病一日至二日氣在孔竅皮膚之間故病者頭痛惡寒身熱腰背強重此邪氣在表隨症發汗則愈龐安時云凡發汗須加裳覆腰以上厚衣覆腰以下以腰足難取汗故也半身無汗病終不解凡發汗後病證仍存於三日內可二三發汗令腰腳周遍為度若病不解便可下之設令下後不解表裡邪亦衰矣宜觀脈證調治七日內可期正汗為善也發汗後不可再行汗者始發熱惡寒今不惡寒但倍發熱而躁始脈浮大今洪實或沉細數始安靜今狂語此胃實陽盛再行汗藥而死須當下之有人始得病變陽盛之證須便下之不可拘日子深淺次第也病三日以上氣浮上部填都胸心故頭痛胸中滿或多痰涎當吐之則愈按龐安時總病論所節十條閱之令人耳目一新所論陰陽表裡寒熱虛實汗下諸法洞若觀火啟迪後進勝讀書十年惜乎全豹未窺憾甚瀾志又云若虛損及新產人不能吐者可服枳實散枳實細末米飲調二錢日可三四服若有虛寒手足冷及脈微弱者枳實二兩加桂枝一兩同末之如前服病五六日以上氣結在臟腑故腹滿身重骨節煩疼當下則愈若小便少手足心並腋下不滋潤尚未可攻下當消息其候不可亂投湯藥虛其胃氣也又云素問載兩感於寒其脈應與其病形者一日則巨陽與少陰俱病頭痛口乾而煩滿二日則陽明與太陰俱病腹滿身熱不欲食讝語三日則少陽與厥陰俱病則耳聾囊縮而厥水漿不入口不知人六日死言其六日死者是臟腑榮衛或有所通行故四日少陰與太陽俱病五日太陰與陽明俱病六日厥陰與少陽俱病是重傳得六日死矣其有三日死者素問謂陽明為五臟十二經脈之長其邪氣盛故不知人三日其氣乃絕故死矣夫邪氣盛則實表裡邪實並領血氣入胃不通於榮衛氣血故氣血隨邪而盡則三日死矣其脈候素問已脫今詳之凡沉者皆屬陰也一日脈當沉而大沉者少陰也大者太陽也二日脈當沉而長三日脈當沉而弦乃以合表裡之脈也沉長沉弦皆隱於沉大凡陰不當合病今三陰與三陽合病故其脈似緊而大似沉實而長亦類革至之死脈也又云傷寒一日巨陽受病前所說膀胱詳矣病源云小腸雖則誤其標本其手足陰陽自有並病者故素問云六日三陰三陽五臟六腑皆受病榮衛不行五臟不通則死矣是表裡次第傳不必兩感亦有至六日傳遍五臟六腑而死者也素問云諸浮不躁者皆在陽則為熱其有躁者在手假令第一日脈不躁是足太陽膀胱脈先病脈加躁者又兼手太陽小腸也又云諸細而沉者皆在陰則為骨痛其有靜者在足假令第四日脈靜者足太陰始傳病也脈加數又手太陰病也故六日亦能傳遍臟腑也躁謂脈數靜謂脈不數用藥則同若用針須取足與手之經也秘旨中載安常治驗云安常尤善針法有孕婦產七日而子不下群醫治之無效眾以死置之適安常過其門病家求視安常一見孕婦呼曰未死令其家人以湯溫其腰腹間以手上下拊摩之孕婦覺腸微痛呻吟間產一子母子無恙有市醫問其因龐曰兒已出胞而一手誤執母腸不能脫投藥無益吾隔腸針其虎口兒既痛即縮手所以遽生無他術也按龐先生安時為宋代良醫著傷寒總病論東坡謂真得古聖賢救人之意豈獨為傳世不朽之資蓋已義貫幽明矣奈滄桑之變世渺流傳吾師命予重校付活字板印附正脈以廣其傳今擇其要論數則錄於醫論之末俾後進知有其書便於尋繹濟人疾厄共登仁壽之域則吾之志矣果齋識芷園治驗云孟抒正君因怒發呃三日夜急柬召予以事奪至未未往診盂抒愁容怨語泣涕嗟苦予診之曰來極遲效極速藥進而寢次日喜見曰昨心欲裂方治後事以兄詼諧寬我耳寧期一藥而果效真不解其故予曰予開肝鬱也內君特怒之未暢氣將入胃而不能故發呃予不治呃用柴胡等條達木鬱郁解則止暴病氣全故易愈耳積學日深見病知源況暴病正氣未傷故效驟速愈矣按呃由怒起沖氣欲入胃而不能則發呃盧先生用柴胡條達木鬱而瘳未將全方藥味示人乃重道不肯輕泄治法則後進未能效尤矣今既用柴胡條達木鬱可隅反而知其餘之藥亦不外薄荷苓芍歸草等味即逍遙散一方以解木鬱而諸郁均解予治驗中亦仿鼓峰法師其意不泥其方用合歡皮川鬱金枇杷葉香附橘絡金橘餅玫瑰花等隨宜加減變化其方每多獲效惟原方有白朮一味有壅塞氣機濁而不宣之虞斟酌去之為宜如蘇梗撫芎茄楠檀香旋覆花等皆可隨症選用至於名醫用成方必臨症化裁超越凡庸之上也又治白下繕部戴養吾夫人恙召診寸關不透體常倦怠眩運不食胸膈痞滿予以為肝脾之氣不伸用八珍加升麻柴胡愈而體實每病取前方服之即安後之瑞安之滇南十五年皆倚恃焉若稍加減便不獲效養吾公解組林下每過湘水必得良晤嘗以夫人為信心此方也夫人性靜體厚起居安適是以氣血不振而消沮故於補氣藥中加開提之劑蓋得其性情如布帛菽粟若將終身焉者所云信心二字真為良藥世之任醫厭常喜新安得恆守一方至十五年耶信心二字真為衛身至寶近人厭故喜新朝張暮李廣徵方藥賢愚不別遂致輕者重重者危是不知守信心之患矣來熙庵廉憲急柬召予診其侄力大身體豐碩傷寒已二十八日人事不省不能言語手足揚擲腹脹如鼓而熱烙手目赤氣粗齒槁舌黑參附石膏硝黃芩連無不服諸名公以言旋矣予診之脈獨鼓手用大黃一兩佐以血藥一劑下黑臭血一二斗少蘇四劑始清熙庵公問予侄昏三日所存唯一息耳君何用劑且大且多幸遂生全敢問其說予曰治病用藥譬之飲酒滄海之量與之涓滴則喉唇轉燥矣以若大軀殼病邪甚深不十倍其藥何效之臻且此恙寒邪入胃蓄血在中其昏沉揚擲是喜妄如狂之深者也不知為病而望之為死不棄之乎夫大黃未嘗不用苟投非其時品劑輕小一或不應用心惑矣寧能放膽而用哉此為陽明蓄血症用桃仁承氣重劑方能克敵然非學識兼全者不能如是湖墅史大正君嘔吐之聲遠及百武脈之佐關鼓指不連於寸兩尺滑搏於左獨加水飲不入唇七日矣因為透肝之劑斷必孕男藥進而嘔定月足果產男因問予曰內子寒熱大作嘔吐不食人皆以傷寒治之君獨以為孕其柴胡白芍吳萸黃連雖未專用何一劑而嘔遂平予曰醫名方脈者須察脈以定方也人唯伺其證而不循其因是以失之今脈具在不為證瞞因病發藥故其言驗也尺中脈搏固知為妊其關不連寸者蓋肝志專而鬱善怒萬不善發也郁之之既久而自發振拉摧拔之象見焉順其性而伸之調之肝舒氣平惡自無阻而嘔自定耳惡阻嘔吐其因尺中脈搏固以惡阻斷定治以舒肝氣順其性而謂之則嘔自平矣聞於將尊堂丙午冬月心忽然如散而沉下便不得睡幾三月矣召診獨左關弱不能應指予以為肝虛須補其母當立春始安用熟地為君茯苓棗仁當歸人參防風遠志佐之服二十貼至其而愈子將問心散不寐以屬心經何反以腎肝藥見效而言立春日始應請為分疏予曰此得之脈也經曰肝不足則恐恐則氣下雖情志無恐懼而氣象似之據脈按證肝虛無疑矣因肝不足先其令而疾作補母生脾待時而元氣乃復豈得以心散便屬心經是非心散也乃心見身中氣散之象耳則散非病設心臟病則病矣又何能自見其散哉補母以益子是隔二之治言立春始愈乃肝臟正氣旺而邪自退舍矣湯梅生病腹痛痛則繞臍有形甚至欲死人皆謂生氣獨絕於內似有不起之慮予診之關脈近尺有滑拊之脹痛氣羸頗乏精彩因用枸杞為君白芍茯苓肉桂吳萸佐之六劑痛止服瑞竹堂方四制枸杞丸一料竟愈黎茂先舉問何疾予曰臍疝也疝氣引陰原無斯症然疝考有形之痛而有所止之處故字從山不必定引陰也疝本厥陰肝疾其狀若死亦厥陰證故用溫補肝藥生氣自復不致內絕此案貪天之功予為可作起死一則看也臍疝乃厥陰危險之候治以溫補是從根底而治也李姓口舌生瘡幾三年矣脈浮細急數按之空虛而尺尤甚用薛立齋腎虛火不歸經法以加減八味丸料二劑即愈此案初試立齋先生法紀其捷效如此為近世高明之家獨出奇見欲超出規矩繩墨之表不知視立齋為何如永嘉何介甫文學性沉靜病脾數年飲食少啖精神萎悴辛酉七月就診兩關軟弱不透於寸用參苓歸芍陳皮防風甘草數十劑至九月始歸遂喜啖肥濃數年之疾脫然壬戌春再過錢塘攜美人蕉佛桑花贈遺特盛問曰子疾有年補脾補腎法非不詳而未之效君何從平易得之予曰君疾在肝非脾腎也凡診病者當窮其源無為證惑如飲食少雖關脾胃其所以致脾病者何故此自當審考今君兩關脈弱不透於寸右固脾虛明矣而左則何應此蓋脾體不足而脾用不行也何謂脾之用肝也星家取克我者為用神脾體無肝木為之用則氣血便不條暢運化遲鈍而脾轉困矣自秋令金肅肝更不伸予為補助肝木之氣使之揚溢則脾土伸舒精神油然外發雖不治脾實所以治也安用奇特之法哉予正恐不能平易耳平易之言學之所未熊者今請事斯語名醫治病必求其源而辨其脈不為外證形勢所惑補不足損有餘本經旨以立方吳叔顯上舍庚申三月生瘡眼藥瘡愈而喘急殊甚十日不能就枕予往診之先用開肺發瘡次用降氣補腎斷其二日當瘡發五日當足腫六日當出水十日可喘定就睡嗣後足牛二毒三月始復秋之日下就國學讀書次年七月偶以傷風微熱左三部脈唯隱隱見飲大劑人參歸木甘草十帖脈方起二十帖如常十月再感左脈更不如秋但微熱而起居如故也三月就枕七日頭痛如破因告其兄極道秋病之危今若昏沉決無生理彼尚疑余言九日果微昏譫語十二日不識人再七三死其族昆問曰叔顯昨歲垂危君言變證歷歷如響幸全生焉今冬示微恙果應君言而歿其證其因為一為兩答曰叔顯骨氣天弱腎精不全其瘡亦從腎發焉不知而用發散藥元氣轉耗瘡毒內逆於肺而喘予用四逆散使太陰氣開瘡遂外出用六味料使少陰納氣息遂內勻清升濁降足腫生癰病都外出是以生也今秋左脈不起知元氣內索不堪左旋矣比起而再戕賊之病發於骨髓所以腦痛因之遂昏乃內關之證氣獨內絕是以死也論其根本出皆於腎是一非兩不在證之輕重為異同也此案辨治精詳非深於靈素之蘊所不能道也少陰腎虛元氣內索是內關危證生氣內絕不治之症矣蜀富順孝廉阮太和諱士肅病癘吳山下召予診披衣強坐對語甚壯神氣則內索也身熱進退舌胎黃而厚蓋自吳門受寒以肉羹為補而對啜之遂纏綿及月餘用疏散輕劑熱退又復強啖再熱不能起坐予時之富春五日歸診之譫妄呼笑不識人已三日形骨立汗雨下內熱特甚而胸脅之熱捫之烙手第脈尚有神予用人參八錢加四逆散中一劑而譫妄定三劑而熱邪清矣自言其神魂窮天之上極地之下飛揚奇變得太乙神符召之始得返生愈彌旬方啜粥病中自為之記別時間藥狀余謂此寒傷心氣荏苒厥深而湊於胸也緣以不第南旋病淹中道骨肉之音雖近實違藥石之給既缺且竭心已傷矣又反復再四汗液多亡內無主宰熱遂入胸胸為心主之宮城精神因而渙散是以遊魂為變也用四逆使熱外出加人參俾神內凝氣復邪散是以生耳始由氣鬱不舒則傷肝繼則強啖傷脾是以精神煥散遊魂為變用四逆散退逐外熱加參以益元氣富陽周婦馬女皆少年水腫肢體洪盛臚腹膨脹水道不通飲食絕口有以為疸者為臌者為氣者予往診之以藥不克濟乃針足上出水皆石余次日脹小減三日大減足尚腫又針之令服八味丸以溫其腎期年皆孕周善調護子母兩全馬失調護子母俱斃此蓋腎中陽氣不足陰氣有餘遂聚水而病作飲食湯藥用水而不能導之輾轉助長乃致於此非針去水則菀陳之淤何從而泄水去腎衰非溫補之則濁凝之陰必致復聚腎中之火大復然周身之陽氣有蒂天癸自行生育可必如流離之後所宜愛養得之則生聚否斯待斃耳蓋腎中陽氣不足陰氣有餘遂聚水致病是此病之源也內經有聚水而成其類是也庚申臘月二十七夜予患腹痛惡寒泄瀉平旦且止至暮復作明日又止至改元五日肛左微痛起因房室意為腎泄服四神丸一大劑泄痛竟止早間肛左稍有核其痛漸近尾閭暮痛不可反側次暮以水化熊膽塗之立覺涼氣直上肺左痛亦漸緩略堪展轉中夜吐痰痰內見血一二點辰時痔出白厚膿竟可起坐十一日早與人多話方櫛發血從咳至作意忍之氣定且止煎六味丸料服亦以腎虛也暮就枕夜半睡覺血即上湧如潮喘聲如鋸進童便及六味煎藥氣稍定才聞薑湯氣觸鼻血即隨湧平旦始緩夜再發如前凡假寐片響背心蒸熱醒即血來咽喉如截斷一湧盈掬心急躁亂欲多語言聲一響而血洊至矣十三早議下莫敢應至晚勢急似無生理乃用瀉心配血藥下之不應夜方大雪點水成凍用水調大黃末服轉欲去衣被啜芩連苦藥如甘旨至五更強進清米飲藥力忽轉解黑糞瘀泥臭穢不可近凡三次血來之勢少平十五寅時交立春建寧老蓮煎濃湯呷之甚美少間足心汗出次手心出次背心蒸蒸欲出一日安和至暮以多語言吐鮮血數口頤兒引仲景義以赤小豆連翹合瀉心方法服之覺上身氣即開臍以下不動而悶汗出似前者三日血亦漸減二十外大便自解如青泥次解如鐵彈者二三枚血方淨盡嗟嗟未解之前幾至不免汗出之後始有生機追思病發之由十足曾暴怒頓足叫呼氣喘如食頃臘月十七圍爐露坐大半夜指爪朝來盡折方旬遂病蓋自十月便不能構思看書亦不深入近覺神思昏瞀者浹旬病乃大重余作醫二十年治吐血證眾往往起其危疑及自罹此便無主腦如因房室起病泄瀉在夜服四神而病已益信為腎虛不疑豈知服四神六味反為助長以致病甚起病始由暴怒氣鬱凝其血脈繼因夜坐受寒加以爐火外燔是以寒氣愈凝血液受焚留瘀之源也必用逐瘀折其銳氣以除病根為探本之治致禍之因實為四神六味之遺患耳所以用藥不能偏執一經而論若非偶中仲景方法死不免矣原余之疾本於寒傷陰分而寒水之氣當乘心火陰分之邪宜應迫血用補腎血劑偏助寒氣愈凝血液火故暴焚血留轉瘀也立春陰分汗出勢自然解瘀穢下盡血方始清初以微寒竟成大禍用藥之難慣見且誤如臟毒之疼痛吐血之喘急須認其原從寒生但當未解時縱有人指出其端倪恐自亦不信也而況不知醫者乎故審疾處方不可執定規矩今人知其吐血便用止血行血順氣降氣種種方法豈非妙理若不深中肯綮反成毒害慎之慎之病愈四十日方能策杖盤躄室中出寄素芝禪室靜言思之殊自可愧簡出成案用供博採按成客讀之難曰吐血之因起自於寒容或有之血湧之狀以為非火實難深信且水之與火不可同語主何說以通之余曰人生氣交中平時惟一太極內含陰陽五行之妙不可得見其端倪病則偏而動陰陽五行自相摩蕩如止水之風自有波瀾也設若受寒即見寒之氣象便是波瀾內撼其機變現傾移往復之相所謂一而二矣故人傷於寒則為病熱熱則火反病也受一分寒倒見一分火寒則十分則火有十分者勢也理也吐血固為火象其所以然實寒氣抑之鼓之而火始有力病之本源不在於火而在於寒明矣豈得竟以象火而歸重於火耶治病必求於本必審於內毋以形似害其義也客問傷寒當分六經君之吐血屬之何經曰寒者冬時之令也人病因此先動氣化余病在氣化中論之不入經也入經便有定位便可標法指示自是傷寒一家宜應別論余初冬怒甚便當動血雖不嘔出血奚其清而寒復傷榮藥偏補腎其滔天驚人者勢使然也客問設以為寒何不發散而以苦寒下之實有似乎治火矣又用赤小豆連翹者何義啜蓮肉湯而得汗者又何故也曰寒之害人當分陰陽表裡余受寒於夜奪濁其血故邪湊其陰而陰屬有形之榮所處深密非表病之當發散者也寒凝火鬱理必炎上非苦寒之味從火之性而使之降其熱未可服也火熱鬱勃勢雖燎炎原從制抑所生須作不足論之仲景云心氣不足吐血衄血者瀉心湯主之瀉心者瀉血分有餘之邪使之相平乎不足之氣也心有不足血無所主兼併奪蓄之瘀郁遏盛甚而致暴焚載血上行倉皇洊妄非下有形安克效哉顧苦寒下法似乎降火不知火之成患政在不得上炎有形能去火空斯發心氣無虞不足之從來實在堅凝閉密之寒火得疏通安問堅凝閉密者乎則奚為治火實散寒也其用連翹之易散假赤豆之色同皆欲心氣之開自無堅凝之害至若蓮得夏氣之英華子中復含甲用透心之端倪者心氣偏鬱於陰透之還從陰出又汗為心液而從手足陰分外發則蓮子之用若神助焉其發明原理處精透極矣客問四神一劑而泄痛止六味數進而喘急平已見成效何得以為助長也曰余疾之來始於盛怒成於受寒發於房室三因較之二分有餘一分不足今以四神之堅固六味之填塞則腎平矣而寒水合德嚴凝甚深抑火燔焫非無所自且藥石之力量氣血之轉移只在毫芒之間可輕試耶助長之言識法自懼耳客問睡覺火湧源從何出此從胃溢出雖有咳喘非關肺也若自喉來為真臟證斷無生理矣曰胃經雖多氣多血吐時盛甚中有幾何能若是耶蓋此從胃出非胃中來第自暴怒傷肝血藏之機不無沸擾況是冬時閉藏不密浸至於寒榮遂大沮周身之血不凝而濁矣人臥血歸平和肝乃納之今其濁矣遂會流於胃海醒時生氣上升乘之汛濫滿出耳客曰聞姜便吐亦生氣之升乎曰血流在胃緩因藥力姜氣辛烈觸彼將來之勢遂復湧起無足怪者客曰未吐血時先見神昏者何故曰此蓄血之徵也血在上則喜忘在下則如狂昏正喜忘之別稱躁妄如狂之氣象也心主血又主神血無主則妄動神無主而狂與忘隨之矣客曰心氣不足與脈合否曰從病以來脈氣弦弱獨左寸不透正氣不足之徵而弦則肝之變動為寒外束之象也客曰吐血之因於寒義有三隅之反則風暑燥濕四氣亦可例之否曰天地之間六合之內氣一而已因時之化則有六者之別實五氣耳謂之同品可以因寒自然四氣亦可例之矣然亦可以推深而論如吐血病之一證也則凡可以證稱者皆當用五氣貫之此則萬病之肯綮也客曰病若亟時脈已散亂當主何者用藥曰此當據證不必脈也方此之際生死在指顧中如兩軍相敵非此則彼余在主將有膽力以持之耳念昔曾治一通家子暮方吐血心煩目眩眷屬環繞驚惶擾亂余乃遣其眷屬一手扶掖一手與藥久之自煩而運乃按膽隱忍堅持不失俟自安定再與調護遂得轉危為安可見主之者須要大有力量拼身嚮往病者方有依怙若不按膽不耐性顧己身不顧人命呼吸之間便分生死安可忽諸按膽隱忍堅持不失是救危之至言古醫治病痌瘝在抱拚身嚮往遂可轉危而安近世之醫雖負盛名偶遇症象稍危即棄而不顧畏首畏尾自己保名不肯擔任絲毫若是者存心太忍豈與寇盜何異者哉按盧不遠先生所著各種其語多另出新義茲編亦系抄藏秘本恐湮沒失傳特附錄之
